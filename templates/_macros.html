{% macro password_field(field_id, field_name, autocomplete="current-password", minlength=none, required=true, placeholder=none) %}
<div class="input-group">
    <input type="password" id="{{ field_id }}" name="{{ field_name }}" class="form-control"
           {% if placeholder %}placeholder="{{ placeholder }}" {% endif %}autocomplete="{{ autocomplete }}"{% if minlength %} minlength="{{ minlength }}"{% endif %}{{ " required" if required else "" }}>
    <button type="button" class="btn btn-outline-secondary password-toggle" data-target="{{ field_id }}"
            data-label-show="{{ t('password.show') }}" data-label-hide="{{ t('password.hide') }}"
            aria-label="{{ t('password.show') }}" aria-pressed="false" title="{{ t('password.show') }}">
        <svg class="password-icon-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg class="password-icon-hide d-none" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
    </button>
</div>
{% endmacro %}

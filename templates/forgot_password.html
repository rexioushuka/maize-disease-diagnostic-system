{% extends "base.html" %}
{% block title %}{{ t('forgot.title') }} - {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="app-card">
            <h3 class="fw-bold text-success mb-1">{{ t('forgot.title') }}</h3>
            <p class="text-muted small mb-4">{{ t('forgot.subtitle') }}</p>

            <form method="POST" action="{{ url_for('forgot_password') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="identifier">{{ t('forgot.identifier') }}</label>
                    <input type="text" id="identifier" name="identifier" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">{{ t('forgot.submit') }}</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-decoration-none small text-success fw-bold">{{ t('auth.back_login') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

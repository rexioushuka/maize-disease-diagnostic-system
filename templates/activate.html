{% extends "base.html" %}
{% block title %}{{ t('activate.title') }} - {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="app-card">
            <h3 class="fw-bold text-success mb-1">{{ t('activate.title') }}</h3>
            <p class="text-muted small mb-4">{{ t('activate.subtitle') }}</p>

            <form method="POST" action="{{ url_for('auth.activate_officer') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="code">{{ t('activate.code') }}</label>
                    <input type="text" id="code" name="code" class="form-control"
                           placeholder="{{ t('activate.code_placeholder') }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="contact">{{ t('activate.contact') }}</label>
                    <input type="text" id="contact" name="contact" class="form-control" required>
                    <small class="text-muted">{{ t('activate.contact_hint') }}</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="full_name">{{ t('activate.full_name') }}</label>
                    <input type="text" id="full_name" name="full_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="username">{{ t('activate.username') }}</label>
                    <input type="text" id="username" name="username" class="form-control"
                           autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="password">{{ t('activate.password') }}</label>
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="new-password" minlength="12" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">{{ t('activate.submit') }}</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-success fw-bold">{{ t('auth.back_login') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

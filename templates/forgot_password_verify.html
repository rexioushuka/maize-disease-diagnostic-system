{% extends "base.html" %}
{% block title %}{{ t('forgot.verify_title') }} - {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-8">
        <div class="app-card">
            <h3 class="fw-bold text-success mb-1">{{ t('forgot.verify_title') }}</h3>
            <p class="text-muted small mb-4">{{ t('forgot.verify_subtitle') }}</p>

            <form method="POST" action="{{ url_for('auth.forgot_password_verify') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="code">{{ t('register.verify_code') }}</label>
                    <input type="text" id="code" name="code" class="form-control text-center fs-4"
                           inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                           autocomplete="one-time-code" required autofocus>
                    <small class="text-muted">{{ t('register.verify_hint') }}</small>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">{{ t('forgot.verify_submit') }}</button>
            </form>

            <form method="POST" action="{{ url_for('auth.forgot_password_verify_resend') }}" class="mt-3 text-center">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-link text-success fw-bold">{{ t('forgot.verify_resend') }}</button>
            </form>

            <div class="text-center mt-2">
                <a href="{{ url_for('auth.login') }}" class="small text-muted text-decoration-none">{{ t('auth.back_login') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

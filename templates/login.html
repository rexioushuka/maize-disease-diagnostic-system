{% extends "base.html" %}
{% block title %}{{ t('auth.login_title') }} - {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="app-card">
            <h3 class="fw-bold text-success mb-1">{{ t('auth.login_title') }}</h3>
            <p class="text-muted small mb-4">{{ t('auth.login_subtitle') }}</p>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="login_input">{{ t('auth.username_label') }}</label>
                    <input type="text" id="login_input" name="login_input" class="form-control"
                           placeholder="{{ t('auth.username_placeholder') }}" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="password">{{ t('auth.password') }}</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="{{ t('auth.password_placeholder') }}" autocomplete="current-password" required>
                </div>
                <div class="text-end mb-4">
                    <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none">{{ t('auth.forgot') }}</a>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">{{ t('auth.signin') }}</button>
            </form>

            <hr class="my-4">
            <div class="d-flex flex-column gap-2 text-center small">
                <span class="text-muted">
                    {{ t('auth.no_account') }}
                    <a href="{{ url_for('auth.register') }}" class="text-success fw-bold text-decoration-none">{{ t('auth.register_link') }}</a>
                </span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

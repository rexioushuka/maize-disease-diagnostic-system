{% extends "base.html" %}
{% block title %}{{ t('change.title') }} - {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="app-card">
            <h3 class="fw-bold text-success mb-1">{{ t('change.title') }}</h3>
            <p class="text-muted small mb-4">{{ t('change.subtitle') }}</p>

            <form method="POST" action="{{ url_for('change_password') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="current_password">{{ t('change.current') }}</label>
                    <input type="password" id="current_password" name="current_password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="new_password">{{ t('change.new') }}</label>
                    <input type="password" id="new_password" name="new_password" class="form-control"
                           autocomplete="new-password" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="confirm_password">{{ t('change.confirm') }}</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                           autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">{{ t('change.submit') }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

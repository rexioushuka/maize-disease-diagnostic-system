{% extends "base.html" %}
{% block title %}{{ t('register.title') }} - {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
        <div class="app-card">
            <h3 class="fw-bold text-success mb-1">{{ t('register.title') }}</h3>
            <p class="text-muted small mb-4">{{ t('register.subtitle') }}</p>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="full_name">{{ t('register.full_name') }}</label>
                        <input type="text" id="full_name" name="full_name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="username">{{ t('register.username') }}</label>
                        <input type="text" id="username" name="username" class="form-control"
                               autocomplete="username" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="contact">{{ t('register.contact') }}</label>
                        <input type="text" id="contact" name="contact" class="form-control"
                               placeholder="{{ t('register.contact_placeholder') }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">{{ t('register.account_type') }}</label>
                        <input type="text" class="form-control bg-light" value="{{ t('register.account_fixed') }}" disabled>
                        <small class="text-muted">{{ t('register.account_hint') }}</small>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="section_id">{{ t('register.section') }}</label>
                        <select id="section_id" name="section_id" class="form-select" required>
                            {% for sec in sections %}
                            <option value="{{ sec.section_id }}">{{ sec.section_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="password">{{ t('register.password') }}</label>
                        <input type="password" id="password" name="password" class="form-control"
                               autocomplete="new-password" minlength="12" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="confirm_password">{{ t('register.confirm') }}</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                               autocomplete="new-password" minlength="12" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-4">{{ t('register.submit') }}</button>
            </form>

            <div class="text-center mt-3 small text-muted">
                {{ t('register.have_account') }}
                <a href="{{ url_for('auth.login') }}" class="text-success fw-bold text-decoration-none">{{ t('register.login_link') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

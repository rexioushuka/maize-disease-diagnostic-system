name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LOAD_MODEL: "0"
      APP_CONFIG: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest Flask Werkzeug Pillow numpy
      - name: Run tests
        run: pytest tests -q

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt || true

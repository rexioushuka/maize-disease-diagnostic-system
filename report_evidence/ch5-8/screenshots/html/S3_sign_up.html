<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="REDACTED_CSRF_TOKEN">
    <title>Farmer Sign-Up - Maize Disease Diagnostic System</title>

    <link href="http://127.0.0.1:5058/static/css/style.css" rel="stylesheet">
    
</head>
<body data-msg-preparing="Please wait while the image is being prepared."
      data-msg-camera-unsupported="Live camera requires HTTPS on this network. Open this page over HTTPS (https://&lt;host&gt;:5443) or use the camera app."
      data-msg-camera-denied="Could not access the camera. Please use the camera app or file picker."
      data-authenticated="0"
      data-idle-timeout="30"
      data-logout-url="/logout/idle"
      data-csrf-token="REDACTED_CSRF_TOKEN"
      data-user-key="">
<nav class="navbar navbar-expand-lg navbar-dark app-nav">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            Maize Diagnostic
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                
                    <li class="nav-item">
                        <a class="nav-link "
                           href="/login">Sign In</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active"
                           href="/register">Register</a>
                    </li>
                
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Language: English
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        
                        <li>
                            <a class="dropdown-item active"
                               href="/set_language/en?next=/register">English</a>
                        </li>
                        
                        <li>
                            <a class="dropdown-item "
                               href="/set_language/ny?next=/register">Chichewa</a>
                        </li>
                        
                    </ul>
                </li>
                
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    
        
    

    

<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
        <div class="app-card">
            <h3 class="fw-bold text-success mb-1">Farmer Sign-Up</h3>
            <p class="text-muted small mb-4">Self-registration is for local farmers only</p>

            <form method="POST" action="/register">
                <input type="hidden" name="_csrf_token" value="REDACTED_CSRF_TOKEN">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="full_name">Full Name</label>
                        <input type="text" id="full_name" name="full_name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                               autocomplete="username" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="contact">Email or Phone Number</label>
                        <input type="text" id="contact" name="contact" class="form-control"
                               placeholder="farmer@example.com or +265..." required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Account Type</label>
                        <input type="text" class="form-control bg-light" value="Local Farmer (fixed)" disabled>
                        <small class="text-muted">Extension officers cannot sign up here</small>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="section_id">Village Section (Liwaladzi EPA)</label>
                        <select id="section_id" name="section_id" class="form-select" required>
                            
                            <option value="2">Gowoka</option>
                            
                            <option value="3">Kambwiri</option>
                            
                            <option value="6">Kautaka</option>
                            
                            <option value="7">Liwaladzi Central</option>
                            
                            <option value="5">Nsindwa</option>
                            
                            <option value="1">Nzumala</option>
                            
                            <option value="4">Zunga</option>
                            
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="password">Create Password (min 12 characters)</label>
                        
<div class="input-group">
    <input type="password" id="password" name="password" class="form-control"
           autocomplete="new-password" minlength="12" required>
    <button type="button" class="btn btn-outline-secondary password-toggle" data-target="password"
            data-label-show="Show password" data-label-hide="Hide password"
            aria-label="Show password" aria-pressed="false" title="Show password">
        <svg class="password-icon-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg class="password-icon-hide d-none" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
    </button>
</div>

                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="confirm_password">Confirm Password</label>
                        
<div class="input-group">
    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
           autocomplete="new-password" minlength="12" required>
    <button type="button" class="btn btn-outline-secondary password-toggle" data-target="confirm_password"
            data-label-show="Show password" data-label-hide="Hide password"
            aria-label="Show password" aria-pressed="false" title="Show password">
        <svg class="password-icon-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg class="password-icon-hide d-none" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
    </button>
</div>

                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-4">Create Farmer Account</button>
            </form>

            <div class="text-center mt-3 small text-muted">
                Already registered?
                <a href="/login" class="text-success fw-bold text-decoration-none">Login</a>
            </div>
        </div>
    </div>
</div>

</main>

<footer class="app-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span>&copy; 2026 Maize Disease Diagnostic System</span>
        <span>Liwaladzi, Nkhotakota District</span>
    </div>
</footer>

</body>
</html>

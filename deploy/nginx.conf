# TLS-terminating reverse proxy for the maize disease system.
# Terminates HTTPS on :5443 and forwards to the Flask app on :5000.
# Place the generated certificate and key next to this file (see run_https.py),
# or point the paths below at your organisation certificate.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Basic abuse protection is handled in the app; nginx adds connection limits.
    limit_req_zone $binary_remote_addr zone=app:10m rate=20r/s;

    upstream maize_app {
        server app:5000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host:5443$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/maize-lan-cert.pem;
        ssl_certificate_key /etc/nginx/certs/maize-lan-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        client_max_body_size 6m;

        location / {
            limit_req zone=app burst=40 nodelay;
            proxy_pass http://maize_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
    }
}
